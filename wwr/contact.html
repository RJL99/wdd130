<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="Logo of white water rafting">
        <nav>

            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

    <section class="contact-info"></section>>
    <h2>Company Information</h2>

    <address>
        913 N Henefer Frontage Rd<br>
        Henefer, Utah 84033<br>
        <a href="tel:19999999999">
            +1 999 999 9999
        </a><br>
        <a href="mailto:info@wildrafting.com">info@wildrafting.com</a>

        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3009.853590884897!2d-111.5038819234001!3d41.02845897134772!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8752499496b553f9%3A0xb3aa22e69f06e5f5!2s913%20N%20Henefer%20Frontage%20Rd%2C%20Henefer%2C%20UT%2084033!5e0!3m2!1sen!2sus!4v1791489286850!5m2!1sen!2sus"

          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

        </section>

        <section class="team">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="riverguide.jpg" alt="River Guide showing how to row">
                <figcaption>Vance Ridley — River Guide</figcaption>
            </figure>
            <figure>
                <img class="safety-image" src="safety coordinator.jpg" alt="The person in charge of all our safety
              needs">
                <figcaption>Chad Grimm -Safety Coordinator</figcaption>
            </figure>
            <figure>
                <img src="Reservation Manager.jpg"
                  alt="The lady in charge of making sure you get scheduled">
                <figcaption>Vanessa Holden — Reservation Manager</figcaption>
            </figure>
        </section>
        <section>
            <h2>Contact Us</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <fieldset>
                    <legend>Purpose</legend>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservations" name="purpose" value="reservations">
                    <label for="reservations">Reservation Question</label>

                    <input type="radio" id="suggestions" name="purpose" value="suggestions">
                    <label for="suggestions">Website Suggestion</label>
                </fieldset>
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea><input type="checkbox"
                  id="newsletter" name="newsletter">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label><button
                  type="submit">Send Message</button>
            </form>

        </section>
        </main>

        <footer>
